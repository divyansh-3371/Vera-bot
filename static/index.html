<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vera Demo</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #1c1f24; --muted: #667085; --line: #e4e7ec;
    --accent: #6d28d9; --accent-ink: #ffffff; --chat-bg: #efeae2; --vera: #ffffff; --me: #d9fdd3;
    --chip: #f2f4f7; --sys: #fff4d6; --sys-ink: #7a5a00; --end: #fde2e2; --end-ink: #9b1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #171a21; --ink: #e7e9ee; --muted: #98a2b3; --line: #2a2f3a;
      --accent: #a78bfa; --accent-ink: #14111f; --chat-bg: #0b141a; --vera: #202c33; --me: #005c4b;
      --chip: #232833; --sys: #3a3218; --sys-ink: #f5d78a; --end: #3b1d1d; --end-ink: #f7b4b4;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
           display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  select, input[type=text] { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
                              background: var(--panel); color: var(--ink); font: inherit; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 9px 14px; }
  .primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; width: 100%; margin-top: 10px; }
  .primary:disabled { opacity: .6; cursor: wait; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  .side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .chat { display: flex; flex-direction: column; height: calc(100vh - 110px); min-height: 520px; padding: 0; overflow: hidden; }
  @media (max-width: 820px) { .chat { height: 75vh; } }
  .chat-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
  .chat-head b { display: block; } .chat-head small { color: var(--muted); }
  .log { flex: 1; overflow-y: auto; background: var(--chat-bg); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 78%; padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere;
         box-shadow: 0 1px 1px rgba(0,0,0,.08); }
  .msg.vera { background: var(--vera); align-self: flex-start; border-top-left-radius: 2px; }
  .msg.me { background: var(--me); align-self: flex-end; border-top-right-radius: 2px; }
  .who { font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
  .sys { align-self: center; background: var(--sys); color: var(--sys-ink); font-size: 12px; padding: 5px 10px; border-radius: 8px; max-width: 90%; text-align: center; }
  .sys.end { background: var(--end); color: var(--end-ink); }
  details { margin-top: 6px; font-size: 12px; color: var(--muted); }
  details summary { cursor: pointer; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .tag { background: var(--chip); border-radius: 6px; padding: 1px 6px; font-size: 11px; }
  .empty { margin: auto; color: var(--muted); text-align: center; max-width: 320px; }
  .quick { display: flex; gap: 6px; padding: 8px 10px 0; overflow-x: auto; background: var(--panel); border-top: 1px solid var(--line); }
  .quick button { background: var(--chip); color: var(--ink); white-space: nowrap; font-size: 12px; padding: 6px 10px; border-radius: 16px; }
  form { display: flex; gap: 8px; padding: 10px; background: var(--panel); }
  form button { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .typing { color: var(--muted); font-size: 12px; align-self: flex-start; }
</style>
</head>
<body>
<header>
  <h1>Vera — merchant assistant demo</h1>
  <span>Pick a scenario, see Vera's first WhatsApp, then reply as the merchant.</span>
</header>
<main>
  <section class="side">
    <div class="card">
      <h2>Scenario</h2>
      <select id="scenario" aria-label="Scenario"><option>Loading…</option></select>
      <button class="primary" id="start">Send Vera's first message</button>
    </div>
    <div class="card" id="ctxCard" hidden>
      <h2>Context Vera used</h2>
      <dl id="ctx"></dl>
    </div>
  </section>

  <section class="card chat">
    <div class="chat-head">
      <div><b id="chatTitle">No conversation yet</b><small id="chatSub">WhatsApp · simulated</small></div>
    </div>
    <div class="log" id="log"><div class="empty">Choose a scenario on the left and press <b>Send Vera's first message</b>.</div></div>
    <div class="quick" id="quick">
      <button data-msg="Ok let's do it. What's next?">👍 Let's do it</button>
      <button data-msg="Haan interesting hai, par kitna time lagega?">🤔 Question (Hinglish)</button>
      <button data-msg="How much will this cost me?">💰 Cost?</button>
      <button data-msg="Thank you for contacting us! Our team will respond shortly.">🤖 Auto-reply</button>
      <button data-msg="Busy right now, call me later">⏰ Later</button>
      <button data-msg="Can you help me file my GST this month?">📄 Off-topic (GST)</button>
      <button data-msg="Why do you keep bothering me, this is useless">😠 Annoyed</button>
      <button data-msg="Not interested. Stop messaging me.">🛑 Stop</button>
    </div>
    <form id="form">
      <input type="text" id="input" placeholder="Reply as the merchant…" autocomplete="off" disabled>
      <button type="submit" id="send" disabled>Send</button>
    </form>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let convId = null, ended = false, busy = false;

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

function add(html, cls) {
  const log = $("log");
  log.querySelector(".empty")?.remove();
  const el = document.createElement("div");
  el.className = cls; el.innerHTML = html;
  log.appendChild(el); log.scrollTop = log.scrollHeight;
  return el;
}

function veraBubble(body, meta) {
  const tags = Object.entries(meta.tags || {}).filter(([, v]) => v !== undefined && v !== null && v !== "")
    .map(([k, v]) => `<span class="tag">${esc(k)}: ${esc(v)}</span>`).join("");
  add(`<div class="who">${esc(meta.who || "Vera")}</div>${esc(body)}
       <details><summary>Why this message</summary>${esc(meta.rationale || "")}<div class="tags">${tags}</div></details>`, "msg vera");
}

function setInput(enabled) {
  $("input").disabled = !enabled; $("send").disabled = !enabled;
  document.querySelectorAll("#quick button").forEach(b => b.disabled = !enabled);
}

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}

async function loadScenarios() {
  try {
    const { scenarios } = await api("/demo/scenarios");
    $("scenario").innerHTML = scenarios.map(s =>
      `<option value="${s.test_id}">${s.test_id} · ${s.kind.replaceAll("_", " ")} — ${esc(s.merchant)}${s.customer ? " → " + esc(s.customer) : ""}</option>`).join("");
  } catch (e) { $("scenario").innerHTML = `<option>Failed to load: ${esc(e.message)}</option>`; }
}

$("start").onclick = async () => {
  if (busy) return;
  busy = true; $("start").disabled = true; $("start").textContent = "Composing…";
  $("log").innerHTML = ""; ended = false; setInput(false);
  const typing = add("Vera is typing…", "typing");
  try {
    const d = await api("/demo/start", { test_id: $("scenario").value });
    typing.remove();
    convId = d.conversation_id;
    const c = d.context;
    const facing = d.message.send_as === "merchant_on_behalf";
    $("chatTitle").textContent = facing ? `${c.customer} (customer of ${c.merchant})` : `${c.merchant}`;
    $("chatSub").textContent = facing ? "You are the customer · message sent on the merchant's behalf" : `You are ${c.owner || "the owner"} · ${c.place}`;
    $("ctx").innerHTML = [
      ["Merchant", c.merchant], ["Owner", c.owner], ["Where", c.place], ["Category", c.category],
      ["Languages", (c.languages || []).join(", ")], ["Trigger", c.trigger_kind?.replaceAll("_", " ")],
      ["Trigger data", Object.keys(c.trigger_payload || {}).length ? JSON.stringify(c.trigger_payload) : "(none — generic event)"],
      ["Active offers", (c.active_offers || []).join(", ") || "none"], ["Customer", c.customer || "—"],
    ].map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
    $("ctxCard").hidden = false;
    veraBubble(d.message.body, {
      who: facing ? `${c.merchant} (drafted by Vera)` : "Vera", rationale: d.message.rationale,
      tags: { cta: d.message.cta, send_as: d.message.send_as, model: d.source, language: d.language, ms: d.latency_ms },
    });
    setInput(true); $("input").focus();
  } catch (e) {
    typing.remove(); add(`Error: ${esc(e.message)}`, "sys end");
  } finally {
    busy = false; $("start").disabled = false; $("start").textContent = "Send Vera's first message";
  }
};

async function reply(text) {
  if (!convId || ended || busy || !text.trim()) return;
  busy = true; setInput(false);
  add(esc(text), "msg me");
  $("input").value = "";
  const typing = add("Vera is thinking…", "typing");
  try {
    const d = await api("/demo/reply", { conversation_id: convId, message: text });
    typing.remove();
    if (d.action === "send") {
      veraBubble(d.body, { rationale: d.rationale, tags: { action: "send", cta: d.cta, ms: d.latency_ms } });
    } else if (d.action === "wait") {
      add(`⏸ Vera waits ${Math.round(d.wait_seconds / 3600 * 10) / 10}h before trying again — ${esc(d.rationale)}`, "sys");
    } else {
      ended = true;
      add(`✖ Vera ended the conversation — ${esc(d.rationale)}`, "sys end");
    }
  } catch (e) {
    typing.remove(); add(`Error: ${esc(e.message)}`, "sys end");
  } finally {
    busy = false;
    if (!ended) { setInput(true); $("input").focus(); }
  }
}

$("form").onsubmit = (e) => { e.preventDefault(); reply($("input").value); };
document.querySelectorAll("#quick button").forEach(b => b.onclick = () => reply(b.dataset.msg));
setInput(false);
loadScenarios();
</script>
</body>
</html>
